name: MeetingMind build and API contract checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run API validation and privacy tests
        run: node --test tests/*.test.mjs
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
